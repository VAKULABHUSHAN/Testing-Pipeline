[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-sentinel"
version = "0.1.0"
description = "Production-quality local-first mobile application security and QA analysis platform for Flutter Android applications"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mobile Sentinel Team" }
]
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sentinel = "sentinel.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
